<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 74" width="74" height="74" fill="none">
  <defs>
    <linearGradient id="themeBg" x1="0" y1="0" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="themeScreen" x1="12" y1="10" x2="62" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="38" y1="36" x2="56" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="20" y1="18" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="32" y1="52" x2="42" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="themeShadow" x="6" y="8" width="62" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Container Base Plate -->
  <rect x="2" y="2" width="70" height="70" rx="16" fill="url(#themeBg)" stroke="#bae6fd" stroke-width="1.5"/>

  <!-- Main Monitor with Filter -->
  <g filter="url(#themeShadow)">
    <!-- Monitor Bezel -->
    <rect x="10" y="10" width="54" height="38" rx="7" fill="url(#themeScreen)" stroke="#334155" stroke-width="1.5"/>
    <!-- Inner Gloss Line -->
    <rect x="12" y="12" width="50" height="34" rx="5" fill="#090d16"/>

    <!-- Left: Theme Sun & Moon Toggle -->
    <g transform="translate(16, 17)">
      <!-- Sun Body -->
      <circle cx="9" cy="9" r="6" fill="url(#sunGrad)"/>
      <circle cx="9" cy="9" r="3" fill="#ffffff" fill-opacity="0.4"/>
      <!-- Small Sun Rays -->
      <path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.3 3.3l1.4 1.4M13.3 13.3l1.4 1.4M3.3 14.7l1.4-1.4M13.3 4.7l1.4-1.4" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Soft Crescent Moon Overlay in background -->
      <path d="M19 14a5.5 5.5 0 0 1-5-7.8 6 6 0 1 0 6.8 7.6c-.6.1-1.2.2-1.8.2z" fill="#a78bfa" opacity="0.9"/>
    </g>

    <!-- Center Divider -->
    <line x1="37" y1="15" x2="37" y2="43" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Right: Speed & Performance Gauge -->
    <g transform="translate(39, 16)">
      <!-- Gauge Outer Track -->
      <path d="M4 21 A 11 11 0 1 1 20 21" fill="none" stroke="#334155" stroke-width="2.8" stroke-linecap="round"/>
      <!-- Active Gauge Arc -->
      <path d="M4 21 A 11 11 0 1 1 17 9" fill="none" stroke="url(#gaugeGrad)" stroke-width="2.8" stroke-linecap="round"/>
      <!-- Gauge Needle Center Hub -->
      <circle cx="12" cy="19" r="2.5" fill="#ffffff"/>
      <!-- Needle Arrow pointing fast -->
      <line x1="12" y1="19" x2="16.5" y2="10.5" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <!-- Speed Flash Dots -->
      <circle cx="6" cy="18" r="1" fill="#10b981"/>
      <circle cx="12" cy="9" r="1" fill="#f59e0b"/>
      <circle cx="18" cy="18" r="1" fill="#ef4444"/>
    </g>

    <!-- Monitor Stand Pedestal -->
    <path d="M34 48 L32 57 L42 57 L40 48 Z" fill="url(#standGrad)"/>
    <!-- Base Foot -->
    <rect x="25" y="57" width="24" height="3" rx="1.5" fill="#475569"/>
    <rect x="27" y="57.5" width="20" height="1" rx="0.5" fill="#94a3b8"/>
  </g>

  <!-- Floating Palette Chip (Bottom Left) -->
  <g transform="translate(8, 44)">
    <circle cx="8" cy="8" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="6" cy="6" r="2" fill="#0284c7"/>
    <circle cx="10.5" cy="6.5" r="2" fill="#10b981"/>
    <circle cx="7" cy="11" r="2" fill="#f43f5e"/>
  </g>
</svg>
