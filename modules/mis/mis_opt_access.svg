<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 74" width="74" height="74" fill="none">
  <defs>
    <linearGradient id="accessBg" x1="0" y1="0" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="16" y1="8" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="lockGold" x1="28" y1="28" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shackleMetal" x1="32" y1="20" x2="42" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="accessShadow" x="8" y="6" width="58" height="62" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Container Base Plate -->
  <rect x="2" y="2" width="70" height="70" rx="16" fill="url(#accessBg)" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Shield Group -->
  <g filter="url(#accessShadow)">
    <!-- Main Outer Shield -->
    <path d="M37 8 L57 16 C57 37 47 52 37 60 C27 52 17 37 17 16 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="1.5"/>

    <!-- Inner Shield Rim -->
    <path d="M37 12 L53 18.5 C53 36 44.5 48.5 37 55.5 C29.5 48.5 21 36 21 18.5 Z" fill="#0f172a" fill-opacity="0.3"/>

    <!-- View Role Eye Emblem -->
    <g transform="translate(37, 23)">
      <path d="M -12 0 Q 0 -8 12 0 Q 0 8 -12 0 Z" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="0" cy="0" r="4.5" fill="#0284c7"/>
      <circle cx="0" cy="0" r="2" fill="#0f172a"/>
      <circle cx="1.2" cy="-1.2" r="0.8" fill="#ffffff"/>
    </g>

    <!-- Brass Padlock (Centered Below Eye) -->
    <g transform="translate(37, 41)">
      <!-- Lock Shackle -->
      <path d="M -5 -4 V -9 A 5 5 0 0 1 5 -9 V -4" fill="none" stroke="url(#shackleMetal)" stroke-width="3" stroke-linecap="round"/>
      <!-- Padlock Body -->
      <rect x="-9" y="-4" width="18" height="15" rx="3.5" fill="url(#lockGold)" stroke="#a16207" stroke-width="1"/>
      <!-- Keyhole -->
      <circle cx="0" cy="1" r="2" fill="#713f12"/>
      <path d="M -1 2 L -1.5 6 L 1.5 6 L 1 2 Z" fill="#713f12"/>
    </g>

    <!-- Authorized Check Badge (Top Right) -->
    <g transform="translate(50, 14)">
      <circle cx="0" cy="0" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M -3 0 L -1 2 L 3 -2" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
