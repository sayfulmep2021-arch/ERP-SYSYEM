<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 74" width="74" height="74" fill="none">
  <defs>
    <linearGradient id="editBg" x1="0" y1="0" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="windowHeader" x1="12" y1="12" x2="54" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="stylusBody" x1="0" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="editShadow" x="8" y="8" width="58" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ea580c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Container Base Plate -->
  <rect x="2" y="2" width="70" height="70" rx="16" fill="url(#editBg)" stroke="#fed7aa" stroke-width="1.5"/>

  <!-- Master Page Window with Filter -->
  <g filter="url(#editShadow)">
    <!-- Window Body Frame -->
    <rect x="11" y="11" width="46" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Window Header Bar -->
    <path d="M 11 17 A 6 6 0 0 1 17 11 L 51 11 A 6 6 0 0 1 57 17 L 57 23 L 11 23 Z" fill="url(#windowHeader)"/>

    <!-- Window Dots -->
    <circle cx="16" cy="17" r="1.8" fill="#f87171"/>
    <circle cx="21" cy="17" r="1.8" fill="#facc15"/>
    <circle cx="26" cy="17" r="1.8" fill="#4ade80"/>

    <!-- Canvas Layout Grid Blocks -->
    <rect x="16" y="28" width="16" height="12" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 1"/>
    <rect x="36" y="28" width="16" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <rect x="16" y="44" width="36" height="11" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Layout Guides & Alignments -->
    <line x1="20" y1="32" x2="28" y2="32" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="26" y2="36" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Isometric Stylus / Pen (Floating on Bottom Right) -->
  <g transform="translate(52, 45) rotate(-35)">
    <!-- Pen Barrel -->
    <rect x="-3" y="-22" width="6" height="24" rx="2" fill="url(#stylusBody)" stroke="#9a3412" stroke-width="1"/>
    <!-- Grip Rings -->
    <line x1="-3" y1="-8" x2="3" y2="-8" stroke="#fed7aa" stroke-width="1"/>
    <line x1="-3" y1="-12" x2="3" y2="-12" stroke="#fed7aa" stroke-width="1"/>
    <!-- Top Cap Button -->
    <rect x="-2" y="-25" width="4" height="3" rx="1" fill="#94a3b8"/>
    <!-- Conical Tip -->
    <polygon points="-3,2 3,2 0,9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
    <polygon points="-1,6.5 1,6.5 0,9" fill="#0f172a"/>
  </g>

  <!-- Slider / Adjustment Badge (Top Right) -->
  <g transform="translate(48, 14)">
    <circle cx="6" cy="6" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 3 6 H 9 M 5 4 V 8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
