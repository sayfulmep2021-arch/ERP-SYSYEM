<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 74" width="74" height="74" fill="none">
  <defs>
    <linearGradient id="linksBg" x1="0" y1="0" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="emeraldChain" x1="16" y1="16" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cyanChain" x1="32" y1="32" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="linksShadow" x="8" y="10" width="58" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Base Plate -->
  <rect x="2" y="2" width="70" height="70" rx="16" fill="url(#linksBg)" stroke="#a7f3d0" stroke-width="1.5"/>

  <!-- Document / Data Sheet Card Background -->
  <g transform="translate(14, 12)">
    <rect x="0" y="0" width="46" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Spreadsheet Grid Lines -->
    <line x1="6" y1="8" x2="22" y2="8" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="15" x2="40" y2="15" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="21" x2="34" y2="21" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="27" x2="28" y2="27" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Interlocking Chain Links with Shadow -->
  <g filter="url(#linksShadow)">
    <!-- Chain Ring 1 (Top Left - Emerald) -->
    <g transform="translate(24, 28) rotate(-45)">
      <rect x="-11" y="-5.5" width="22" height="11" rx="5.5" fill="none" stroke="url(#emeraldChain)" stroke-width="4.5"/>
    </g>

    <!-- Center Connection Pulse -->
    <circle cx="37" cy="39" r="3" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>

    <!-- Chain Ring 2 (Bottom Right - Cyan) -->
    <g transform="translate(42, 46) rotate(-45)">
      <rect x="-11" y="-5.5" width="22" height="11" rx="5.5" fill="none" stroke="url(#cyanChain)" stroke-width="4.5"/>
    </g>
  </g>

  <!-- Edit Pencil (Floating on Right) -->
  <g transform="translate(49, 14) rotate(45)">
    <!-- Pen Barrel -->
    <rect x="-2" y="-12" width="4" height="14" rx="1" fill="url(#penBody)" stroke="#d97706" stroke-width="0.8"/>
    <!-- Metal Band -->
    <rect x="-2" y="-14" width="4" height="2" fill="#94a3b8"/>
    <!-- Eraser -->
    <rect x="-1.8" y="-16.5" width="3.6" height="2.5" rx="1" fill="#f43f5e"/>
    <!-- Tip Point -->
    <polygon points="-2,2 2,2 0,6" fill="#ca8a04"/>
    <polygon points="-0.8,4.5 0.8,4.5 0,6" fill="#1e293b"/>
  </g>

  <!-- External Link Indicator Sparkle -->
  <g transform="translate(15, 49)">
    <circle cx="6" cy="6" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 4 8 L 8 4 M 5.5 4 L 8 4 L 8 6.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
